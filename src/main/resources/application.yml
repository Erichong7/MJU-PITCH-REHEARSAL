spring:
  application:
    name: mju-pitch-rehearsal
  profiles:
    default: local
  config:
    # API 키 등 비밀값은 프로젝트 루트의 .env 파일에만 둡니다 (깃에 올리지 않음)
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      # Whisper 제한에 맞춰 녹음 파일은 최대 25MB (초과 시 413)
      max-file-size: 25MB
      max-request-size: 26MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  tomcat:
    # 25MB를 넘는 요청도 끝까지 받아서 413 응답을 돌려주기 위함
    max-swallow-size: 100MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# 외부 연동 설정 (값은 .env 또는 서버 환경변수로 주입)
# AI(피드백·비교)와 STT 모두 OpenAI(GPT)를 사용하므로 키는 하나로 통일
openai:
  api-key: ${OPENAI_API_KEY:}
  # 재연습 비교 판정이 gpt-4o-mini에서는 불안정해 gpt-4.1-mini 사용 (#39)
  model: ${OPENAI_MODEL:gpt-4.1-mini}
  timeout-sec: 60
llm:
  # fake: 가짜 AI, openai: GPT 연결 (진짜 AI 구현 후 사용)
  provider: ${LLM_PROVIDER:fake}
stt:
  # fake: 가짜 STT (항상 같은 전사), whisper: OpenAI Whisper (OPENAI_API_KEY 필요)
  provider: ${STT_PROVIDER:fake}
  whisper:
    model: whisper-1
    timeout-sec: 120
fake:
  # 가짜 STT·AI가 기다리는 시간(ms). ⑤ 상태 조회에서 단계 변화를 보기 위함
  delay-ms: ${FAKE_DELAY_MS:2000}
storage:
  # local: 내 컴퓨터 디스크(./uploads), S3 준비 후 s3로 교체
  type: ${STORAGE_TYPE:local}
  local:
    dir: ${STORAGE_LOCAL_DIR:./uploads}
    # ⑩ 재생 링크 앞부분 (앱 에뮬레이터에서는 http://10.0.2.2:8080 등으로 바꾸기)
    public-base-url: ${STORAGE_LOCAL_BASE_URL:http://localhost:8080}
    # 재생 링크 서명 키. 비우면 서버를 켤 때마다 새로 만듦
    signing-secret: ${STORAGE_LOCAL_SIGNING_SECRET:}
aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET:}
