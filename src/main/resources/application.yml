spring:
  application:
    name: mju-pitch-rehearsal
  profiles:
    default: local
  config:
    # API 키 등 비밀값은 프로젝트 루트의 .env 파일에만 둡니다 (깃에 올리지 않음)
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# 외부 연동 설정 (값은 .env 또는 서버 환경변수로 주입)
openai:
  api-key: ${OPENAI_API_KEY:}
llm:
  # fake: 가짜 AI (항상 같은 답), 진짜 AI 구현 후 해당 값으로 변경
  provider: ${LLM_PROVIDER:fake}
  api-key: ${LLM_API_KEY:}
aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET:}
