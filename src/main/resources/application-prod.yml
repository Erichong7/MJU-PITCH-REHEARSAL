# 배포용: DB는 AWS RDS(MySQL). 접속 정보는 서버 환경변수로 주입
# 예) DB_URL=jdbc:mysql://<RDS 엔드포인트>:3306/pitch?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
