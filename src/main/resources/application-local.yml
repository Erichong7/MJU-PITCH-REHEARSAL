# 로컬 개발용: Docker로 띄운 MySQL (docker compose up -d)
spring:
  datasource:
    url: jdbc:mysql://localhost:${LOCAL_DB_PORT:3306}/pitch?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${LOCAL_DB_USERNAME:pitch}
    password: ${LOCAL_DB_PASSWORD:pitch}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 재시작해도 데이터 유지. 테이블을 처음부터 다시 만들려면 docker compose down -v
      ddl-auto: update
    show-sql: true
